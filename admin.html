<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Authentication | Umais Ur Rehman</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/img/profile.jpeg">

  <style>
    .admin-wrapper {
      padding: 40px 0 80px;
    }
    .auth-card {
      max-width: 420px;
      margin: 110px auto;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .admin-section-box {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 36px;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .form-grid-2 { grid-template-columns: 1fr; }
    }
    .action-btn-group {
      display: flex;
      gap: 8px;
    }
    .badge-cat {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent-cyan);
    }
    .current-avatar-preview {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .profile-photo-container {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- Background Interactive Particles Canvas -->
  <canvas id="canvas-particles"></canvas>

  <!-- Navigation Header -->
  <header class="admin-header">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">U</div>
        <div class="logo-text">Umais<span>.dev</span> <small style="font-size: 0.75rem; background: rgba(0, 240, 255, 0.15); color: var(--accent-cyan); padding: 3px 8px; border-radius: 4px; margin-left: 6px;">Portal</small></div>
      </a>

      <div style="display: flex; align-items: center; gap: 16px;">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">
          <i class="fa-solid fa-sun"></i>
        </button>

        <a href="gallery.html" target="_blank" class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-palette"></i>
          <span>Art Gallery</span>
        </a>

        <a href="index.html" class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-arrow-left"></i>
          <span>View Site</span>
        </a>

        <button id="btn-logout" class="btn btn-outline btn-sm" style="display: none;" onclick="logoutAdmin()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Lock</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container admin-wrapper">

    <!-- Authentication Screen (Shown by default to all visitors) -->
    <div id="auth-panel" class="auth-card">
      <div style="width: 58px; height: 58px; border-radius: 50%; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-cyan); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 1.5rem; color: var(--accent-cyan);">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 style="font-size: 1.5rem; margin-bottom: 8px;">Portal Authentication</h2>
      <p style="font-size: 0.9rem; margin-bottom: 24px; color: var(--text-muted);">
        Enter authorization passcode to access management settings.
      </p>

      <form id="admin-login-form">
        <div class="form-group" style="text-align: left;">
          <label for="admin-passcode" class="form-label">Passcode</label>
          <input type="password" id="admin-passcode" class="form-control" placeholder="Enter passcode" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <i class="fa-solid fa-key"></i>
          <span>Authenticate & Unlock</span>
        </button>
      </form>
    </div>

    <!-- Dynamic Admin Dashboard Container (Injected ONLY upon successful SHA-256 verification) -->
    <div id="admin-dashboard-container"></div>

  </main>

  <script src="js/portfolio-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
